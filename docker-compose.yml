services:
  # 1. Redis - In-memory store for Bull Queue and rate-limiting
  redis:
    image: redis:7-alpine
    container_name: verifai-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - verifai-network

  # 2. MongoDB - Primary NoSQL database
  mongo:
    image: mongo:7.0
    container_name: verifai-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - verifai-network

  # 3. VerifAI Express API & Worker Backend
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: verifai-server
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - ./server/.env
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/verifai
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
      - mongo
    networks:
      - verifai-network

networks:
  verifai-network:
    driver: bridge

volumes:
  redis_data:
  mongo_data:
